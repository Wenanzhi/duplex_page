        '处理失败 · 角色模型返回空内容；以下仅为原始音轨，未生成标签';
      document.getElementById('sample-meta').textContent=sample.sample_id+' · '+(sample.duration_ms/1000).toFixed(2)+' 秒'+
        (sample.roles?` · Assistant = 座位 ${sample.roles.assistant_output_slot} · ${sample.frame_count} 个 320 ms 块`:' · 角色未指定')+
        (sample.audio_only_turn_count?` · ${sample.audio_only_turn_count} 段语音无对应转写`:'');
      const tokens=document.getElementById('sample-tokens');tokens.replaceChildren();
      if(sample.view_kind!=='raw_audio') ['speak','listen','wait','idle','bc'].forEach(name=>{
        const token=`<|${name}|>`,badge=document.createElement('span');badge.textContent=`${token} ${sample.token_counts[token]||0}`;tokens.append(badge);
      });
      history.replaceState(null,'',`#sample=${index+1}`);
    }
    selector.addEventListener('change',()=>showSample(Number(selector.value)));
    const initial=Number(location.hash.match(/^#sample=(\d+)$/)?.[1]||1)-1;
    showSample(initial>=0&&initial<collection.samples.length?initial:0);
  </script>
</body>
</html>
