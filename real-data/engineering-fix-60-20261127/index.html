  <script>
    const collection = JSON.parse(document.getElementById("collection-data").textContent);
    const selector = document.getElementById("sample-selector");
    const frame = document.getElementById("sample-viewer");
    const tokens = document.getElementById("sample-tokens");
    document.getElementById("collection-title").textContent = `${collection.title} · ${collection.samples.length} 条录音`;
    if(collection.issues_url){const link=document.getElementById("batch-issues");link.href=collection.issues_url;link.hidden=false;}
    if(collection.comparison_url){const link=document.getElementById("batch-comparison");link.href=collection.comparison_url;link.hidden=false;}
    if(collection.energy_policy){const note=document.getElementById("rule-note");note.textContent="Assistant 主发言期间，User 的 backchannel 不转移话权，保持 speak；反馈结束后、助手继续前的整块静音同步裁剪。Assistant 自己的 bc 只标实际发声块，句内无声块不填 bc。其余无助手输出的块：User 波形非零标 listen（含换气声），全零再判断 wait / idle。";note.hidden=false;}
    collection.samples.forEach((sample, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = `${index + 1}. ${sample.sample_id.slice(0, 8)} · ${sample.status_label || sample.status || "complete"} · ${(sample.duration_ms / 1000).toFixed(2)} 秒`;
      selector.append(option);
    });
    function showSample(index) {
      const sample = collection.samples[index];
      selector.value = String(index);
      frame.src = sample.viewer_url;
      document.getElementById("open-sample").href = sample.viewer_url;
      document.getElementById("sample-meta").textContent = sample.status === "skipped_missing_transcript" ? `${sample.sample_id} · 已跳过整条音频，等待补齐转写；未输出训练 JSON` : `${sample.sample_id} · ${sample.status_label || sample.status || "complete"} · Assistant = ${sample.roles.assistant_output_slot ?? "未指定"} · ${sample.frame_count} 个 320 ms 块` +
        (sample.audio_only_turn_count ? ` · ${sample.audio_only_turn_count} 段语音无对应转写` : "");
      tokens.replaceChildren();
      ["speak", "listen", "wait", "idle", "bc"].forEach(name => {
        const token = `<|${name}|>`;
        const badge = document.createElement("span");
        badge.textContent = `${token} ${sample.token_counts[token] || 0}`;
        tokens.append(badge);
      });
      if(sample.token_counts.null){const badge=document.createElement("span");badge.textContent=`待复核 ${sample.token_counts.null}`;tokens.append(badge);}
      history.replaceState(null, "", `#sample=${index + 1}`);
    }
    selector.addEventListener("change", () => showSample(Number(selector.value)));
    const initial = Number(location.hash.match(/^#sample=(\d+)$/)?.[1] || 1) - 1;
    showSample(initial >= 0 && initial < collection.samples.length ? initial : 0);
  </script>
