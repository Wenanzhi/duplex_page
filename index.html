<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Duplex · Control token 核对</title>
<meta name="description" content="逐块核对双轨波形、对应文本和 control token；统计各类 token 并按位置跳转试听。">
<style>
@font-face{font-family:DuplexHan;font-style:normal;font-weight:100 900;font-display:swap;src:url('assets/demo-sans.woff?v=20261119-tts20-v1') format('woff')}
:root{color-scheme:light;--bg:#f5f7fb;--surface:#fff;--ink:#152238;--muted:#58677d;--line:#d8e1ed;--user:#166788;--assistant:#6b44b7;--active:#eaf0ff;--error:#b3383f;font-family:Inter,DuplexHan,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}main{max-width:1460px;margin:auto;padding:28px}h1{font-size:1.6rem;margin:0 0 6px}h2{font-size:1.05rem;margin:0}p{margin:0}.sub,.muted,.status{color:var(--muted)}.sub{margin-bottom:20px}.small,.status{font-size:.875rem}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.card{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.spread{justify-content:space-between}.stack{display:grid;gap:12px}button,select,input{font:inherit}button,select,input[type=number]{min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}button{cursor:pointer}button:hover{background:var(--active)}button:disabled{opacity:.45;cursor:default}button.primary{background:#244a91;color:#fff;border-color:#244a91}button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--assistant)}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #668ff0;outline-offset:3px}select{max-width:100%}input[type=number]{width:100px}input[type=range]{width:100%;accent-color:#244a91;margin:8px 0}.sample-label{display:flex;flex:1;min-width:0;gap:10px;align-items:center}#demo-select{flex:1;min-width:0;width:0}.token-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.token-stat{text-align:left;padding:12px;min-width:0}.token-name{display:block;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9rem;font-weight:650;overflow-wrap:anywhere;color:var(--assistant)}.token-number{display:block;font-size:1.5rem;font-weight:650;margin-top:5px;font-variant-numeric:tabular-nums}.token-total{display:block;color:var(--muted);font-size:.875rem}.notice{font-size:.875rem;color:var(--muted);margin-top:10px}.error{color:var(--error)}.tabular{font-variant-numeric:tabular-nums}.timeline{position:relative;isolation:isolate;margin-top:12px}.track-row{display:grid;grid-template-columns:78px minmax(0,1fr)}.role{display:flex;align-items:center;font-size:.875rem;font-weight:600}.user{color:var(--user)}.assistant{color:var(--assistant)}.chunk-heads,.track-grid,.control-grid{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr))}.chunk-head{font-size:.8rem;color:var(--muted);padding:8px 5px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums}.chunk-head strong{display:block;font-size:.875rem;color:var(--ink)}.track-grid,.control-grid{border-block:1px solid var(--line);margin-bottom:12px}.cell{min-width:0;border-left:1px solid var(--line)}.cell:nth-child(even){background:color-mix(in srgb,var(--ink) 2%,transparent)}.cell.selected{background:var(--active)}.cell.playing{background:color-mix(in srgb,var(--assistant) 15%,var(--surface))}.control-choice,.cell-button{display:block;width:100%;height:100%;border:0;border-radius:0;background:transparent}.control-choice{padding:10px 4px}.control-token{display:block;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.875rem;font-weight:650;color:var(--assistant);overflow-wrap:anywhere}.control-source{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}.cell-button{padding:0;text-align:left}.cell-text{display:block;padding:9px 6px;min-height:68px;overflow-wrap:anywhere;font-size:1rem}.empty{color:var(--muted);font-size:.875rem}.wave{display:block;width:100%;height:86px;overflow:visible}.terminal-wave{display:flex;align-items:center;justify-content:center;height:86px;color:var(--muted);font-size:.875rem}.playhead{position:absolute;top:0;bottom:12px;width:2px;background:var(--ink);pointer-events:none;z-index:6;display:none}.legend{display:flex;gap:16px;font-size:.875rem}.selection-info{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.location-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.location-button{text-align:left;min-width:0}.location-button span{display:block;overflow-wrap:anywhere}.location-button .mono{color:var(--assistant)}.location-preview{color:var(--muted);font-size:.875rem;margin-top:3px}.location-pages{margin-top:12px}.footer{font-size:.8rem;color:var(--muted)}.footer a{color:var(--muted)}[hidden]{display:none!important}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101620;--surface:#182231;--ink:#e4eaf4;--muted:#a9b6ca;--line:#33445b;--user:#65bbd4;--assistant:#b69bea;--active:#263b5a;--error:#ff9a9f}}
@media(max-width:700px){main{padding:18px 12px}.card{padding:13px}h1{font-size:1.35rem}.token-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.track-row{grid-template-columns:64px minmax(0,1fr)}.role{font-size:.875rem}.location-list{grid-template-columns:1fr}.chunk-head{font-size:.75rem}.control-token{font-size:.875rem}.sample-label{flex-basis:100%}}
</style>
</head>
<body>
<main>
 <h1>Control token 核对</h1>
 <p class="sub" id="demo-summary">正在加载样本……</p>
 <section class="card stack" aria-label="样本与 control token 统计">
  <div class="row spread"><label class="sample-label" for="demo-select">样本 <select id="demo-select"></select></label><span class="small muted" id="sample-count"></span></div>
  <div id="token-stats" class="token-stats"></div>
  <p class="small muted" id="count-summary"></p>
  <p class="small muted">按原始训练记录计数，连续相同 token 逐条计入。点击卡片筛选并定位；末条无目标音频的记录也计入，标为“会话末尾”。</p>
 </section>
 <section class="card" aria-label="波形、文本和 control token">
  <div class="row spread"><h2 id="window-title"></h2><div class="legend"><span class="user">User</span><span class="assistant">Assistant</span></div></div>
  <div class="row spread"><span class="small muted">按 token 定位</span><label class="small" for="token-filter">类型 <select id="token-filter"><option value="">全部 token</option></select></label></div>
  <div class="row" style="margin-top:12px"><button type="button" id="prev-token">上一个</button><button type="button" id="next-token">下一个</button><label for="occurrence-number" class="small">第几处</label><input id="occurrence-number" type="number" min="1" value="1"><button type="button" id="jump-token">定位</button><span id="match-status" class="small muted"></span></div>
  <div class="row" style="margin-top:12px">
   <button type="button" id="play-chunk" class="primary" disabled>播放此块</button><button type="button" id="play-page" disabled>播放本页</button><button type="button" id="play-rest" disabled>从此处播放</button><button type="button" id="play-full" disabled>播放整条</button><button type="button" id="stop" disabled>停止</button>
   <label class="small" for="channel">轨道 <select id="channel"><option value="both">双轨（左 User / 右 Assistant）</option><option value="user">User</option><option value="assistant">Assistant</option></select></label>
  </div>
  <p id="audio-status" class="status" role="status" aria-live="polite" style="margin-top:10px">首次试听时加载音频。</p>
  <div class="row spread" style="margin-top:12px"><span id="position-readout" class="small tabular"></span><span id="clock" class="small tabular">00:00.000</span></div>
  <input id="position" type="range" min="0" max="0" value="0" step="1" aria-label="定位音频块或末条记录">
  <div class="row"><button type="button" id="prev-page">上一页</button><button type="button" id="next-page">下一页</button><label for="chunk-number" class="small">块编号</label><input id="chunk-number" type="number" min="0" step="1" value="0"><button type="button" id="jump-chunk">定位</button></div>
  <p class="notice">两轨按同一时段展示，Control 对应此时段的助手目标，来自上一输入块；助手开场可为空输入。文本保留导出分块，波形共用幅度刻度。</p>
  <div id="timeline" class="timeline">
   <div class="track-row"><div class="role">音频块</div><div id="chunk-heads" class="chunk-heads"></div></div>
   <div class="track-row"><div class="role">Control</div><div id="control-track" class="control-grid"></div></div>
   <div class="track-row"><div class="role user">User</div><div id="user-track" class="track-grid"></div></div>
   <div class="track-row"><div class="role assistant">Assistant</div><div id="assistant-track" class="track-grid"></div></div>
   <div id="playhead" class="playhead"></div>
  </div>
  <p id="selection-info" class="selection-info small" aria-live="polite"></p>
 </section>
 <section class="card" aria-label="按 control token 定位">
  <h2>Token 位置列表</h2>
  <div id="location-list" class="location-list"></div>
  <div class="row location-pages"><button type="button" id="locations-prev">上一组位置</button><button type="button" id="locations-next">下一组位置</button><span id="locations-page" class="small muted"></span></div>
 </section>
 <p class="footer">字体：Duplex Chunk Sans（Noto Sans CJK），<a href="assets/OFL.txt">SIL OFL 1.1</a>。</p>
</main>
<script>
(async () => {
 'use strict';
 const UI_VERSION='20261125-control-review-qualified-v1';
 const $=id=>document.getElementById(id),query=new URLSearchParams(location.search);
 const catalogPath=query.get('set')==='previous'?'assets/catalog.json':'assets/catalog.random10.json';
 async function readJSON(path){const r=await fetch(path+'?v='+UI_VERSION);if(!r.ok)throw Error('数据读取失败：HTTP '+r.status);return r.json();}
 let catalog=await readJSON(catalogPath);
 const requestedDemo=query.get('demo');
 if(requestedDemo&&!catalog.samples.some(s=>s.id===requestedDemo)&&query.get('set')!=='previous'){
  const old=await readJSON('assets/catalog.json');if(old.samples.some(s=>s.id===requestedDemo))catalog=old;
 }
 const available=catalog.samples.filter(s=>s.data),selected=available.find(s=>s.id===requestedDemo)||available[0];
 if(!selected)throw Error('此组暂无带音轨和分块的样本。');
 for(const sample of available){const o=document.createElement('option');o.value=sample.id;o.textContent=sample.label;$('demo-select').append(o);}
 $('demo-select').value=selected.id;
 $('demo-select').onchange=()=>{const u=new URL(location.href);u.searchParams.set('v',UI_VERSION);u.searchParams.set('demo',$('demo-select').value);u.searchParams.delete('chunk');u.searchParams.delete('record');const token=$('token-filter').value;if(token)u.searchParams.set('token',token);else u.searchParams.delete('token');u.hash='';location.assign(u);};
 if(catalog.samplingScope==='qualified_current_exports'&&available.some(s=>s.status!=='complete'||s.perPassed!==true))throw Error('抽检清单包含未完成或 PER 未通过的样本，停止加载。');
 const D=await readJSON(selected.data),ASSET_VERSION=catalog.viewerVersion;
 if(D.viewerVersion!==ASSET_VERSION)throw Error('展示数据版本不一致，请刷新重试。');
 if(catalog.controlSummary?.policy&&D.controlTokenPolicy!==catalog.controlSummary.policy)throw Error('Control token 数据版本不一致，请刷新重试。');
 const roles=['user','assistant'],N=D.frames.length,SR=D.sampleRate,CS=D.chunkSamples;
 const state={selected:0,page:0,columns:8,filter:'',locationPage:0,playing:false,serial:0,sources:[],channel:'both',ctx:null,variant:D.variants.balanced?'balanced':Object.keys(D.variants)[0],buffers:{},loading:{},startAt:0,startSample:0,endSample:0};
 const entries=[],targetRecords=new Map(),unlocated=[];
 for(const record of D.records){
  const input=record.input.content.find(c=>c.media_id==='user'),audio=record.target.audio_target;
  const target=audio?Math.round(audio.span_ms[0]/D.chunkMs):input?Math.round(input.span_ms[0]/D.chunkMs)+1:(D.initialSpeaker==='assistant'&&record.chunk_index===0?0:null);
  const entry={record,token:record.target.control_token,target,input};entries.push(entry);
  if(target===null||target<0||target>N){unlocated.push(entry);continue;}
  if(targetRecords.has(target))throw Error('同一目标位置存在多条记录，不能覆盖标注：'+target);
  targetRecords.set(target,entry);
 }
 const slots=N+(targetRecords.has(N)?1:0),counts={},physicalCounts={},terminalCounts={},tokenOrder=['<|listen|>','<|wait|>','<|bc|>','<|speak|>','<|idle|>'];
 for(const e of entries){counts[e.token]=(counts[e.token]||0)+1;const bucket=e.target===N?terminalCounts:physicalCounts;bucket[e.token]=(bucket[e.token]||0)+1;}
 for(const key of Object.keys(counts))if(!tokenOrder.includes(key))tokenOrder.push(key);
 const elem=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
 const time=s=>{const ms=Math.round(s*1000);return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0');};
 const numeric=n=>n.toLocaleString('en-US');
 function matches(){return entries.filter(e=>!state.filter||e.token===state.filter);}
 function currentEntry(){return targetRecords.get(state.selected);}
 function setStatus(text,error=false){$('audio-status').textContent=text;$('audio-status').classList.toggle('error',error);}
 function savePosition(){try{localStorage.setItem('duplex-control:'+D.id,JSON.stringify({selected:state.selected,channel:state.channel,filter:state.filter}));}catch(_){}}
 function renderStats(){
  $('token-stats').replaceChildren();
  for(const token of tokenOrder){
   const b=elem('button','token-stat');b.type='button';b.setAttribute('aria-pressed',String(state.filter===token));b.setAttribute('aria-label',token+'，当前样本 '+(counts[token]||0)+' 条，筛选定位');
   b.append(elem('span','token-name',token),elem('span','token-number',numeric(counts[token]||0)),elem('span','token-total','当前标注'+(selected.controlCountsBefore?'（原 '+numeric(selected.controlCountsBefore[token]||0)+'）':'')),elem('span','token-total','音频块 '+numeric(physicalCounts[token]||0)+' · 末条 '+numeric(terminalCounts[token]||0)));
   const all=catalog.controlSummary?.counts[token];if(typeof all==='number')b.append(elem('span','token-total','本组 '+available.length+' 条：'+numeric(all)+(catalog.controlSummary.before?'（原 '+numeric(catalog.controlSummary.before[token]||0)+'）':'')));
   b.onclick=()=>setFilter(token,true);$('token-stats').append(b);
  }
 }
 function setFilter(token,jump=false){for(const o of $('demo-select').children){const sample=available.find(s=>s.id===o.value);o.textContent=sample.label+(token&&sample.controlCounts?' · '+token+' '+numeric(sample.controlCounts[token]||0):'');}state.filter=token;state.locationPage=0;$('token-filter').value=token;renderStats();const rows=matches();if(jump&&rows.length)locateEntry(rows[0]);else{renderLocations();savePosition();}}
 function svgEl(tag,attrs){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));return n;}
 function wave(role,i){
  const svg=svgEl('svg',{viewBox:'0 0 128 86',preserveAspectRatio:'none',class:'wave','aria-hidden':'true'});
  svg.append(svgEl('line',{x1:0,y1:43,x2:128,y2:43,stroke:'var(--line)','stroke-width':.6}));
  const peaks=D.variants[state.variant].peaks[role][i];let path='';
  for(let j=0;j<peaks.length;j+=2){const x=(j/2+.5)*128/(peaks.length/2);path+='M'+x.toFixed(2)+','+(43-peaks[j]/32768*40).toFixed(2)+'V'+(43-peaks[j+1]/32768*40).toFixed(2);}
  svg.append(svgEl('path',{d:path,fill:'none',stroke:'var(--'+role+')','stroke-width':2.7}));return svg;
 }
 function renderTracks(){
  const end=Math.min(slots,state.page+state.columns);document.documentElement.style.setProperty('--columns',end-state.page);
  $('window-title').textContent=state.page>=N?'会话末尾记录 · 无对应音频':'音频块 #'+state.page+'–#'+(Math.min(end,N)-1)+(end>N?' · 会话末尾记录':'');
  $('chunk-heads').replaceChildren();$('control-track').replaceChildren();roles.forEach(r=>$(r+'-track').replaceChildren());
  for(let i=state.page;i<end;i++){
   const terminal=i===N,entry=targetRecords.get(i),head=elem('div','chunk-head');
   head.append(elem('strong','',terminal?'会话末尾':'#'+i),elem('span','',terminal?'无目标音频':time(i*CS/SR)+'–'+time((i+1)*CS/SR)));$('chunk-heads').append(head);
   const control=elem('div','cell'+(i===state.selected?' selected':''));control.dataset.chunk=String(i);
   const choice=elem('button','control-choice');choice.type='button';choice.setAttribute('aria-pressed',String(i===state.selected));choice.setAttribute('aria-label',(terminal?'会话末尾':'块 '+i)+'，'+(entry?.token||'无对应目标记录'));
   choice.append(elem('span','control-token'+(entry?'':' empty'),entry?.token||'—'),elem('span','control-source',entry?'记录 #'+entry.record.chunk_index:'无目标记录'));choice.onclick=()=>selectChunk(i);control.append(choice);$('control-track').append(control);
   for(const role of roles){
    const cell=elem('div','cell'+(i===state.selected?' selected':''));cell.dataset.chunk=String(i);
    const b=elem('button','cell-button');b.type='button';b.setAttribute('aria-pressed',String(i===state.selected));
    const text=terminal?'':D.frames[i][role+'_text'];b.setAttribute('aria-label',role+'，'+(terminal?'会话末尾，无音频':'块 '+i+'，'+(text||'无新文本')));
    b.append(elem('span','cell-text'+(text?'':' empty'),text||(terminal?'—':'无新文本')),terminal?elem('span','terminal-wave','无音频'):wave(role,i));b.onclick=()=>selectChunk(i);cell.append(b);$(role+'-track').append(cell);
   }
  }
  $('prev-page').disabled=state.page===0;$('next-page').disabled=end>=slots;
  $('play-chunk').disabled=state.selected>=N;$('play-rest').disabled=state.selected>=N;$('play-page').disabled=state.page>=N;
 }
 function renderSelection(){
  const i=state.selected,entry=currentEntry();$('position').value=i;$('chunk-number').value=Math.min(i,N-1);
  $('position-readout').textContent=i===N?'会话末尾 · 无目标音频':'块 #'+i+' / '+(N-1);
  if(!state.playing)$('clock').textContent=time(Math.min(i,N)*CS/SR);
  if(!entry){$('selection-info').textContent='本块没有对应的助手目标记录，Control 显示为 —；不推断标签。';return;}
  const input=entry.input?'User 输入 '+entry.input.span_ms.join('–')+' ms':'空输入';
  $('selection-info').textContent=entry.token+' · 训练记录 #'+entry.record.chunk_index+' · '+input+' · '+(i===N?'会话末尾无目标音频；仅展示原始 token。':'助手目标时段 '+i*D.chunkMs+'–'+(i+1)*D.chunkMs+' ms'+(entry.record.target.audio_target?'':'（无目标音频）'));
 }
 const LOCATION_SIZE=8;
 function renderLocations(){
  const rows=matches(),active=rows.indexOf(currentEntry()),total=rows.length;
  $('match-status').textContent=(active>=0?'当前第 '+(active+1)+' / ':'共 ')+numeric(total)+' 处';
  $('occurrence-number').max=Math.max(1,total);$('occurrence-number').value=active>=0?active+1:1;
  $('prev-token').disabled=!rows.some(e=>e.target!==null&&e.target<state.selected);$('next-token').disabled=!rows.some(e=>e.target!==null&&e.target>state.selected);$('jump-token').disabled=!total;
  const pages=Math.max(1,Math.ceil(total/LOCATION_SIZE));state.locationPage=Math.max(0,Math.min(pages-1,state.locationPage));
  $('location-list').replaceChildren();
  for(let k=state.locationPage*LOCATION_SIZE;k<Math.min(total,(state.locationPage+1)*LOCATION_SIZE);k++){
   const e=rows[k],b=elem('button','location-button');b.type='button';b.setAttribute('aria-pressed',String(e===currentEntry()));
   const label=e.target===N?'会话末尾 · 无目标音频':e.target===null||e.target<0||e.target>N?'无法映射到音频位置':'块 #'+e.target+' · '+time(e.target*CS/SR);
   b.append(elem('span','mono',e.token),elem('span','small','第 '+(k+1)+' 处 · 记录 #'+e.record.chunk_index+' · '+label));
   if(e.target!==null&&e.target>=0&&e.target<N){const f=D.frames[e.target];b.append(elem('span','location-preview','User：'+(f.user_text||'—')+' / Assistant：'+(f.assistant_text||'—')));}
   b.disabled=e.target===null||e.target<0||e.target>N;b.onclick=()=>{locateEntry(e);$('window-title').scrollIntoView({block:'start',behavior:'smooth'});};$('location-list').append(b);
  }
  if(!total)$('location-list').append(elem('p','muted small','当前样本没有此类 token；未补写标注。'));
  $('locations-prev').disabled=state.locationPage===0;$('locations-next').disabled=state.locationPage>=pages-1;$('locations-page').textContent=total?'位置 '+(state.locationPage*LOCATION_SIZE+1)+'–'+Math.min(total,(state.locationPage+1)*LOCATION_SIZE)+' / '+numeric(total):'0 处';
 }
 function selectChunk(i,{keepPlaying=false}={}){
  if(!keepPlaying)stopPlayback();state.selected=Math.max(0,Math.min(slots-1,Math.floor(Number(i)||0)));
  if(state.selected<state.page||state.selected>=state.page+state.columns)state.page=Math.floor(state.selected/state.columns)*state.columns;
  const active=matches().indexOf(currentEntry());if(active>=0)state.locationPage=Math.floor(active/LOCATION_SIZE);
  renderTracks();renderSelection();renderLocations();savePosition();
 }
 function locateEntry(entry){if(entry.target===null||entry.target<0||entry.target>N){setStatus('此记录无法映射到音频位置。',true);return;}selectChunk(entry.target);}
 function moveToken(direction){const rows=matches().filter(e=>e.target!==null&&(direction<0?e.target<state.selected:e.target>state.selected));const e=direction<0?rows[rows.length-1]:rows[0];if(e)locateEntry(e);}
 function stopPlayback(){
  state.serial++;state.playing=false;
  for(const s of state.sources){s.onended=null;try{s.stop();}catch(_){}try{s.disconnect();}catch(_){}}
  state.sources=[];$('stop').disabled=true;$('playhead').style.display='none';for(const c of document.querySelectorAll('.cell.playing'))c.classList.remove('playing');
 }
 async function getAudio(variant=state.variant){
  if(state.buffers[variant])return state.buffers[variant];
  if(state.loading[variant])return state.loading[variant];
  const version=D.variants[variant];
  state.loading[variant]=(async()=>{
   if(!window.AudioContext&&!window.webkitAudioContext)throw Error('浏览器不支持 Web Audio。');
   if(!window.DecompressionStream)throw Error('浏览器不支持无损音频解压，请使用新版 Chrome / Edge / Safari。');
   const Context=window.AudioContext||window.webkitAudioContext;
   if(!state.ctx)state.ctx=new Context({sampleRate:SR});
   await state.ctx.resume();
   if(state.variant===variant)setStatus('正在载入'+version.label+'音轨……');
   const buffers={};
   for(const role of roles){
    const response=await fetch(version.files[role]+'?v='+ASSET_VERSION);
    if(!response.ok)throw Error(role+' 音频读取失败：HTTP '+response.status);
    const stream=response.body.pipeThrough(new DecompressionStream('deflate'));
    const raw=await new Response(stream).arrayBuffer();
    if(raw.byteLength!==D.samples*2)throw Error(role+' 音频长度不匹配，停止播放。');
    const view=new DataView(raw),b=state.ctx.createBuffer(1,D.samples,SR),v=b.getChannelData(0);
    for(let i=0;i<v.length;i++)v[i]=view.getInt16(i*2,true)/32768;
    buffers[role]=b;
   }
   state.buffers[variant]=buffers;
   if(state.variant===variant)setStatus(version.label+'已载入 · '+SR+' Hz · 保留文件增益');
   return buffers;
  })().catch(e=>{delete state.loading[variant];throw e});
  return state.loading[variant];
 }
 async function playRange(start,end){
  stopPlayback();const request=state.serial;$('stop').disabled=false;
  try{
   const buffers=await getAudio();if(request!==state.serial)return;
   await state.ctx.resume();if(request!==state.serial)return;
   const at=state.ctx.currentTime+.04;
   state.startSample=start;state.endSample=end;state.startAt=at;state.playing=true;
   const playRoles=state.channel==='both'?roles:[state.channel];
   for(const role of playRoles){const s=state.ctx.createBufferSource();s.buffer=buffers[role];if(state.channel==='both'){const pan=state.ctx.createStereoPanner();pan.pan.value=role==='user'?-1:1;s.connect(pan);pan.connect(state.ctx.destination);}else{s.connect(state.ctx.destination);}state.sources.push(s);s.start(at,start/SR,(end-start)/SR);}
   state.sources[state.sources.length-1].onended=()=>{if(request===state.serial){state.playing=false;$('stop').disabled=true;$('playhead').style.display='none';$('clock').textContent=time(end/SR);for(const c of document.querySelectorAll('.cell.playing'))c.classList.remove('playing');setStatus('播放完成 · '+time(start/SR)+'–'+time(end/SR));}};
   setStatus(D.variants[state.variant].label+' · 播放 '+time(start/SR)+'–'+time(end/SR)+' · '+(state.channel==='both'?'左 User / 右 Assistant':state.channel));tick(request);
  }catch(e){stopPlayback();setStatus('播放失败：'+e.message,true);}
 }
 function tick(serial){
  if(!state.playing||serial!==state.serial)return;
  const sample=Math.min(state.endSample-1,Math.max(state.startSample,state.startSample+(state.ctx.currentTime-state.startAt)*SR)),i=Math.min(N-1,Math.floor(sample/CS));
  if(i!==state.selected)selectChunk(i,{keepPlaying:true});$('clock').textContent=time(sample/SR);
  for(const c of document.querySelectorAll('.cell'))c.classList.toggle('playing',Number(c.dataset.chunk)===i);
  const rect=$('user-track').getBoundingClientRect(),root=$('timeline').getBoundingClientRect();$('playhead').style.display='block';$('playhead').style.left=(rect.left-root.left+(sample/CS-state.page)/Math.min(state.columns,slots-state.page)*rect.width)+'px';
  requestAnimationFrame(()=>tick(serial));
 }
 $('play-chunk').onclick=()=>playRange(state.selected*CS,Math.min(D.samples,(state.selected+1)*CS));
 $('play-page').onclick=()=>playRange(state.page*CS,Math.min(D.samples,(state.page+state.columns)*CS));
 $('play-rest').onclick=()=>playRange(state.selected*CS,D.samples);$('play-full').onclick=()=>playRange(0,D.samples);
 $('stop').onclick=()=>{stopPlayback();setStatus('已停止。');};$('channel').onchange=()=>{stopPlayback();state.channel=$('channel').value;savePosition();};
 $('position').oninput=()=>selectChunk($('position').value);$('chunk-number').onchange=()=>selectChunk($('chunk-number').value);$('jump-chunk').onclick=()=>selectChunk($('chunk-number').value);
 $('prev-page').onclick=()=>selectChunk(Math.max(0,state.page-state.columns));$('next-page').onclick=()=>selectChunk(Math.min(slots-1,state.page+state.columns));
 $('token-filter').onchange=()=>setFilter($('token-filter').value,true);$('prev-token').onclick=()=>moveToken(-1);$('next-token').onclick=()=>moveToken(1);
 $('jump-token').onclick=()=>{const rows=matches(),n=Math.floor(Number($('occurrence-number').value));if(n>=1&&n<=rows.length)locateEntry(rows[n-1]);};
 $('occurrence-number').onkeydown=e=>{if(e.key==='Enter')$('jump-token').onclick();};
 $('locations-prev').onclick=()=>{state.locationPage--;renderLocations();};$('locations-next').onclick=()=>{state.locationPage++;renderLocations();};
 for(const token of tokenOrder){const option=elem('option','',token+' · '+numeric(counts[token]||0));option.value=token;$('token-filter').append(option);}
 $('position').max=slots-1;$('chunk-number').max=N-1;
 $('sample-count').textContent=available.length+' 条样本';$('demo-summary').textContent=D.topic+' · '+time(D.samples/SR)+' · '+numeric(N)+' 个音频块';
 $('count-summary').textContent='当前样本 '+numeric(entries.length)+' 条标注（音频块 '+numeric(entries.length-Object.values(terminalCounts).reduce((a,b)=>a+b,0))+'，末条 '+Object.values(terminalCounts).reduce((a,b)=>a+b,0)+'）'+(catalog.controlSummary?' · 本组共 '+numeric(catalog.controlSummary.recordCount)+' 条'+(catalog.controlSummary.terminalRecordCount?'，其中末条 '+catalog.controlSummary.terminalRecordCount+' 条':''):'')+(unlocated.length?' · '+unlocated.length+' 条无法定位，请检查原始记录':'');
 try{const s=JSON.parse(localStorage.getItem('duplex-control:'+D.id)||'null');if(s){state.selected=Math.max(0,Math.min(slots-1,s.selected||0));if(['both',...roles].includes(s.channel))state.channel=s.channel;if(tokenOrder.includes(s.filter))state.filter=s.filter;}}catch(_){}
 if(query.has('chunk'))state.selected=Math.max(0,Math.min(N-1,Number(query.get('chunk'))||0));
 const requestedRecord=entries.find(e=>String(e.record.chunk_index)===query.get('record'));if(requestedRecord?.target!==null&&requestedRecord?.target!==undefined)state.selected=Math.max(0,Math.min(slots-1,requestedRecord.target));
 if(tokenOrder.includes(query.get('token')))state.filter=query.get('token');
 $('channel').value=state.channel;$('token-filter').value=state.filter;
 const ro=new ResizeObserver(()=>{const c=Math.max(2,Math.min(12,Math.floor($('user-track').clientWidth/120)));if(c!==state.columns){state.columns=c;state.page=Math.floor(state.selected/c)*c;renderTracks();}});ro.observe($('timeline'));
 renderStats();setFilter(state.filter,false);selectChunk(state.selected);$('play-full').disabled=false;
 if(query.has('token')&&!requestedRecord&&!query.has('chunk')){const rows=matches();if(rows.length)locateEntry(rows[0]);}
 setStatus('首次试听时加载原音频，不额外调整音量。');window.duplexReview={data:D,state,entries,targetRecords,counts,matches,setFilter,selectChunk,locateEntry,moveToken,playRange,stopPlayback,getAudio};
})().catch(error=>{const status=document.getElementById('audio-status');status.textContent='页面加载失败：'+error.message;status.classList.add('error');for(const b of document.querySelectorAll('button'))b.disabled=true;});
</script>
